# ============================================================
# Server
# ============================================================
server.port=8081

# ============================================================
# MySQL — bankdb (datos transaccionales)
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bankdb}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# MongoDB — bank_audit (bitácora)
# ============================================================
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/bank_audit}
spring.data.mongodb.auto-index-creation=true

# ============================================================
# Logging para desarrollo
# ============================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.scheduling=INFO

# ============================================================
# Propiedades conservadas del archivo original
# ============================================================
spring.application.name=bank

# ============================================================
# Bank business rules
# ============================================================
bank.transfers.expiration-window-minutes=60
bank.transfers.expiration-job-rate-ms=60000
